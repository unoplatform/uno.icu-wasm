name: Build and publish

on:
  push:
    branches:
      - main
      - release/**

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - release/**

  workflow_dispatch:
  
env:
  ICU_SOURCE_ZIP_URL: https://github.com/unicode-org/icu/archive/refs/tags/release-77-1.zip
  # Deployment target stamped into the Uno.icu-macos dylibs. Without an explicit value clang
  # inherits the runner's OS version (macos-15 -> minos 15.0). 10.15 matches libUnoNativeMac in
  # Uno.WinUI.Runtime.Skia.MacOS; the arm64 slice is clamped to 11.0 by the toolchain.
  ICU_MACOS_DEPLOYMENT_TARGET: '10.15'

jobs:
  build_unoicu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Build one set of archives per emscripten version consumed by a supported .NET runtime.
        # The Uno.Wasm.Bootstrap native-file selector picks the archive matching the consumer's
        # emscripten version (see nuget/uno.icu-wasm/buildTransitive/Uno.icu-wasm.targets).
        #   3.1.56 -> .NET 9 / .NET 10
        #   5.0.6  -> .NET 11 (preview 6+)
        EMSCRIPTEN_VERSION: [ '3.1.56', '5.0.6' ]
        multithreaded: [true, false]
        simd: [true, false]
    steps:
      - uses: actions/checkout@v2

      - name: Free disk space (Linux)
        uses: ./.github/actions/host-cleanup-linux

      - name: Build unoicu.a
        run: |
          pushd src/unoicu
          FEATURE_DIR=$([ "${{ matrix.multithreaded }}" = 'true' ] && echo 'mt' || echo 'st')
          SIMD_SUFFIX=$([ "${{ matrix.simd }}" = 'true' ] && echo ',simd' || echo '')
          TEMP_SIMD_TAG=$([ "${{ matrix.simd }}" = 'true' ] && echo 'simd' || echo 'nosimd')
          TEMP_OUTPUT="out/${{ matrix.EMSCRIPTEN_VERSION }}/${FEATURE_DIR}-${TEMP_SIMD_TAG}"
          mkdir -p "${TEMP_OUTPUT}"

          docker build --build-arg EMSCRIPTEN_VERSION=${{ matrix.EMSCRIPTEN_VERSION }} --build-arg IS_MULTITHREADED=${{ matrix.multithreaded }} --build-arg IS_SIMD_SUPPORTED=${{ matrix.simd }} --output type=local,dest=${TEMP_OUTPUT} .

          FINAL_DIR="out/unoicu.a/${{ matrix.EMSCRIPTEN_VERSION }}/${FEATURE_DIR}${SIMD_SUFFIX}"
          mkdir -p "${FINAL_DIR}"
          mv "${TEMP_OUTPUT}/unoicu.a" "${FINAL_DIR}/unoicu.a"
          rm -rf "out/${{ matrix.EMSCRIPTEN_VERSION }}"
          popd

      - name: Upload unoicu.a
        uses: actions/upload-artifact@v4
        with:
          name: unoicu-${{ matrix.EMSCRIPTEN_VERSION }}-${{ matrix.multithreaded && 'mt' || 'st' }}-${{ matrix.simd && 'simd' || 'nosimd' }}
          path: ./src/unoicu/out/unoicu.a

  build_icudt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Free disk space (Linux)
        uses: ./.github/actions/host-cleanup-linux

      - name: Build icudt.dat
        run: |
          pushd src/cldr_data
          docker build --build-arg ICU_SOURCE_ZIP_URL=${ICU_SOURCE_ZIP_URL} --output type=local,dest=. .
          popd

      - name: Upload icudt.dat
        uses: actions/upload-artifact@v4
        with:
          name: icudt.dat
          path: ./src/cldr_data/icudt.dat

  build_libicu_windows:
    runs-on: 'windows-2025'
    
    steps:
      - uses: microsoft/setup-msbuild@v2
    
      - uses: actions/checkout@v2
    
      - name: Build ICU
        shell: pwsh
        run: |
          curl -L -o icu.zip $env:ICU_SOURCE_ZIP_URL
          Expand-Archive icu.zip -DestinationPath icu
          $env:ICU_DATA_FILTER_FILE = "$PWD/src/cldr_data/filters.json"

          Push-Location icu/*/icu4c/source

          # Patch all vcxproj files to use static CRT (/MT) instead of dynamic (/MD), eliminating msvcp/vcruntime DLL dependencies
          Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object { (Get-Content $_.FullName) -replace 'MultiThreadedDLL', 'MultiThreaded' | Set-Content $_.FullName }
          
          msbuild allinone\allinone.sln /p:Configuration=Release /p:Platform=x64 /p:SkipUWP=true /p:WindowsTargetPlatformVersion=10.0.26100.0 "/t:common;stubdata" /m
          msbuild allinone\allinone.sln /p:Configuration=Release /p:Platform=ARM64 /p:SkipUWP=true /p:WindowsTargetPlatformVersion=10.0.26100.0 "/t:common;stubdata" /m
    
          Pop-Location
          New-Item -ItemType Directory -Path libx64
          New-Item -ItemType Directory -Path libARM64
          $icuDir = (Get-ChildItem icu).Name
          Copy-Item "icu/$icuDir/icu4c/bin64/icuuc*.dll" libx64
          Copy-Item "icu/$icuDir/icu4c/bin64/icudt*.dll" libx64
          Copy-Item "icu/$icuDir/icu4c/binARM64/icuuc*.dll" libARM64
          Copy-Item "icu/$icuDir/icu4c/binARM64/icudt*.dll" libARM64

      - name: Upload binaries (x64)
        uses: actions/upload-artifact@v4
        with:
          name: libicu-windows-x64
          path: ./libx64

      - name: Upload binaries (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: libicu-windows-arm64
          path: ./libARM64

  build_libicu_osx:
    strategy:
      matrix:
        arch: [ 'x86_64','arm64' ]
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    steps:
      - uses: actions/checkout@v2

      - name: Build ICU
        run: |
          curl -L -o icu.zip ${ICU_SOURCE_ZIP_URL}
          mkdir icu
          unzip -d icu icu.zip
          export ICU_DATA_FILTER_FILE="$PWD/src/cldr_data/filters.json"
          export MACOSX_DEPLOYMENT_TARGET="$ICU_MACOS_DEPLOYMENT_TARGET"
          pushd icu/$(ls icu)/icu4c/source
          ./runConfigureICU macOS --with-data-packaging=archive
          make -j $(sysctl -n hw.physicalcpu)
          popd
          mkdir lib
          cp icu/$(ls icu)/icu4c/source/lib/libicuuc.dylib icu/$(ls icu)/icu4c/source/stubdata/libicudata.dylib lib
          if ${{ matrix.arch == 'arm64' && 'true' || 'false' }} ; then
            mkdir osx-arm64-build
            cp -r icu/$(ls icu)/icu4c/* osx-arm64-build
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: libicu-osx-${{ matrix.arch }}
          path: ./lib

      - name: Upload whole build output for cross-compilation
        uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: libicu-osx-arm64-build
          path: ./osx-arm64-build

  build_libicu_osx_universal:
    needs: [build_libicu_osx]
    runs-on: 'macos-15'
    steps:
      - name: Merge libicu binaries
        uses: actions/upload-artifact/merge@v4
        with:
          name: libicu-osx-merged
          pattern: 'libicu-osx-*'
          separate-directories: true

      - name: Download merged libicu binaries
        uses: actions/download-artifact@v4
        with:
          name: libicu-osx-merged
          path: ./libicu-osx-merged

      - name: Create universal libicu binaries
        run: |
          mkdir libicu_osx_universal
          lipo -create libicu-osx-merged/**/libicuuc.dylib -output libicu_osx_universal/libicuuc.dylib
          lipo -create libicu-osx-merged/**/libicudata.dylib -output libicu_osx_universal/libicudata.dylib

      - name: Verify deployment target
        run: |
          set -euo pipefail
          for lib in libicuuc libicudata; do
            for arch in x86_64 arm64; do
              expected="$ICU_MACOS_DEPLOYMENT_TARGET"
              # arm64 macOS starts at 11.0, so the toolchain raises lower targets to it.
              if [ "$arch" = "arm64" ]; then expected=$(printf '%s\n' 11.0 "$expected" | sort -V | tail -n 1); fi
              minos=$(otool -arch "$arch" -l "libicu_osx_universal/$lib.dylib" | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
              echo "$lib ($arch): minos $minos, expected $expected"
              if [ "$minos" != "$expected" ]; then
                echo "::error::$lib ($arch) is stamped for macOS $minos, expected $expected"
                exit 1
              fi
            done
          done

      - name: Upload universal libicu binaries
        uses: actions/upload-artifact@v4
        with:
          name: libicu_osx_universal
          path: ./libicu_osx_universal/*

  package:
    needs: [build_unoicu, build_icudt, build_libicu_osx_universal, build_libicu_iossim_universal, build_libicu_ios, build_libicu_tvossim_universal, build_libicu_tvos, build_libicu_windows]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: merged-artifacts
          pattern: '{libicu_osx_universal,libicu_iossim_universal,libicu_ios,libicu_tvossim_universal,libicu_tvos,libicu-windows-*,unoicu-*,icudt.dat}'
          separate-directories: true

      - name: Download merged artifacts
        uses: actions/download-artifact@v4
        with:
          name: merged-artifacts
          path: ./merged-artifacts

      - name: List files
        run: |
          Get-ChildItem -Recurse .

      - name: Move binaries to correct locations
        shell: bash
        run: |
          mkdir nuget/uno.icu-macos/libicu
          mv merged-artifacts/libicu_osx_universal/{libicuuc,libicudata}.dylib ./nuget/uno.icu-macos/libicu
          mkdir nuget/uno.icu-ios/iossim
          mv merged-artifacts/libicu_iossim_universal/{libicuuc,libicudata}.a ./nuget/uno.icu-ios/iossim
          mkdir nuget/uno.icu-ios/ios
          mv merged-artifacts/libicu_ios/{libicuuc,libicudata}.a ./nuget/uno.icu-ios/ios

          mkdir nuget/uno.icu-tvos/tvossim
          mv merged-artifacts/libicu_tvossim_universal/{libicuuc,libicudata}.a ./nuget/uno.icu-tvos/tvossim
          mkdir nuget/uno.icu-tvos/tvos
          mv merged-artifacts/libicu_tvos/{libicuuc,libicudata}.a ./nuget/uno.icu-tvos/tvos

          mkdir -p nuget/uno.icu-win/libicu/x64
          mv merged-artifacts/libicu-windows-x64/* ./nuget/uno.icu-win/libicu/x64
          mkdir -p nuget/uno.icu-win/libicu/arm64
          mv merged-artifacts/libicu-windows-arm64/* ./nuget/uno.icu-win/libicu/arm64

          mv ./merged-artifacts/icudt.dat/icudt.dat ./nuget/

          mkdir -p ./nuget/uno.icu-wasm/buildTransitive/native/unoicu.a
          pushd merged-artifacts
          shopt -s nullglob
          for dir in unoicu-*; do
            SRC_BASE="$dir/unoicu.a"
            if [ ! -d "$SRC_BASE" ]; then
              SRC_BASE="$dir"
            fi

            find "$SRC_BASE" -mindepth 1 -maxdepth 1 -type d ! -name '*nosimd*' -print0 | while IFS= read -r -d '' version_dir; do
              cp -R "$version_dir" ../nuget/uno.icu-wasm/buildTransitive/native/unoicu.a/
            done
          done
          find ../nuget/uno.icu-wasm/buildTransitive/native/unoicu.a -type d -name '*nosimd*' -exec rm -rf {} +
          popd

      - name: List files
        run: |
          Get-ChildItem -Recurse .

      - uses: dotnet/nbgv@f088059084cb5d872e9d1a994433ca6440c2bf72 # v0.4.2
        id: nbgv
        with:
          toolVersion: 3.6.139
          setAllVars: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v1.7.2
        with:
          dotnet-version: 8.0.100

      - name: Build nuget
        run: |
          pushd nuget
          .\nuget.exe pack uno.icu-wasm/uno.icu-wasm.nuspec -version ${{ steps.nbgv.outputs.SemVer2 }}
          .\nuget.exe pack uno.icu-macos/uno.icu-macos.nuspec -version ${{ steps.nbgv.outputs.SemVer2 }}
          .\nuget.exe pack uno.icu-ios/uno.icu-ios.nuspec -version ${{ steps.nbgv.outputs.SemVer2 }}
          .\nuget.exe pack uno.icu-tvos/uno.icu-tvos.nuspec -version ${{ steps.nbgv.outputs.SemVer2 }}
          .\nuget.exe pack uno.icu-win/uno.icu-win.nuspec -version ${{ steps.nbgv.outputs.SemVer2 }}
          popd

      - name: Add NuGet Summary
        shell: pwsh
        run: |
          echo '### NuGet Package Summary' >> $env:GITHUB_STEP_SUMMARY
          echo 'Package version: `${{ steps.nbgv.outputs.SemVer2 }}`' >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: ./nuget/*.nupkg

  sign:
    name: Sign Package
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')) }}
    runs-on: windows-latest
    environment: PackageSign

    permissions:
      id-token: write # Required for requesting the JWT

    needs:
      - package

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: artifacts\NuGet

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '9.0.x'

      # Install the code signing tool    
      - name: Install Sign CLI tool
        run: dotnet tool install --tool-path . sign --version 0.9.1-beta.25278.1
      
      # Login to Azure using a ServicePrincipal configured to authenticate agaist a GitHub Action
      - name: 'Az CLI login'
        uses: azure/login@v1
        with:
          allow-no-subscriptions: true
          client-id: ${{ secrets.SIGN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SIGN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SIGN_AZURE_SUBSCRIPTION_ID }}

      - name: List files
        run: |
          Get-ChildItem -Recurse .

      # Run the signing command
      - name: Sign artifacts
        shell: pwsh
        run: >
          ./sign code azure-key-vault
          artifacts\NuGet\*.nupkg
          --publisher-name "Uno Platform"
          --description "uno.icu"
          --description-url "https://github.com/${{ env.GITHUB_REPOSITORY }}"
          --azure-key-vault-managed-identity true
          --azure-key-vault-url "${{ secrets.SIGN_KEY_VAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.SIGN_KEY_VAULT_CERTIFICATE_ID }}"
          --verbosity information

      - name: Upload Signed Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuGet-Signed
          path: .\artifacts\NuGet

  publish_dev:
    name: Publish Dev
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: windows-latest

    needs:
      - sign

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: NuGet-Signed
          path: artifacts

      - name: NuGet Push
        shell: pwsh
        run: |
          dotnet nuget push artifacts\*.nupkg -s https://api.nuget.org/v3/index.json -k "${{ secrets.NUGET_ORG_API_KEY }}" --skip-duplicate

  publish_prod:
    name: Publish Production
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: windows-latest
    environment: Production
    needs:
      - sign
  
    permissions:
      contents: write  # allow pushing tags
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
  
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: NuGet-Signed
          path: artifacts

      - name: NuGet Push
        shell: pwsh
        run: |
          dotnet nuget push artifacts\*.nupkg -s https://api.nuget.org/v3/index.json -k "${{ secrets.NUGET_ORG_API_KEY }}" --skip-duplicate

      - name: Tag Release
        uses: ./.github/workflows/actions/tag-release

  build_libicu_iossim:
    strategy:
      matrix:
        arch: [ 'arm64', 'x86_64' ]
    runs-on: 'macos-15' # arm64
    needs: build_libicu_osx
    steps:
      - uses: actions/checkout@v2

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: libicu-osx-arm64-build
          path: ./osx-arm64-build

      - name: Build ICU
        run: |
          # Thanks to https://github.com/apotocki/icu4c-iosx for the configure options
          curl -L -o icu.zip ${ICU_SOURCE_ZIP_URL}
          mkdir icu
          unzip -d icu icu.zip
          export ICU_DATA_FILTER_FILE="$PWD/src/cldr_data/filters.json"
          CROSS_BUILD_DIR="$(pwd)/osx-arm64-build"
          chmod +x $CROSS_BUILD_DIR/source/bin/* # the exec bit is lost during github actions uploading and downloading
          pushd icu/$(ls icu)/icu4c/source
          ./configure --enable-static --disable-shared --with-data-packaging=static --disable-tools --disable-extras --disable-tests --disable-samples --disable-dyload --host=arm-apple-darwin --build=${{ matrix.arch }}-apple --with-cross-build="$CROSS_BUILD_DIR"/source CFLAGS="-arch ${{ matrix.arch }} -isysroot $(xcode-select -print-path)/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk -mios-simulator-version-min=13.4" CXXFLAGS="-arch ${{ matrix.arch }} -isysroot $(xcode-select -print-path)/Platforms/iPhoneSimulator.platform/Developer/SDKs/iPhoneSimulator.sdk -mios-simulator-version-min=13.4 -c -stdlib=libc++ --std=c++17" LDFLAGS="-stdlib=libc++ -lstdc++"
          make -j $(sysctl -n hw.physicalcpu)
          popd
          mkdir lib
          cp icu/$(ls icu)/icu4c/source/lib/libicuuc.a icu/$(ls icu)/icu4c/source/lib/libicudata.a lib

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: libicu-iossim-${{ matrix.arch }}
          path: ./lib

  build_libicu_ios:
    runs-on: 'macos-15' # arm64
    needs: build_libicu_osx
    steps:
      - uses: actions/checkout@v2

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: libicu-osx-arm64-build
          path: ./osx-arm64-build

      - name: Build ICU
        run: |
          # Thanks to https://github.com/apotocki/icu4c-iosx for the configure options
          curl -L -o icu.zip ${ICU_SOURCE_ZIP_URL}
          mkdir icu
          unzip -d icu icu.zip
          export ICU_DATA_FILTER_FILE="$PWD/src/cldr_data/filters.json"
          CROSS_BUILD_DIR="$(pwd)/osx-arm64-build"
          chmod +x $CROSS_BUILD_DIR/source/bin/* # the exec bit is lost during github actions uploading and downloading
          pushd icu/$(ls icu)/icu4c/source
          ./configure --enable-static --disable-shared --with-data-packaging=static --disable-tools --disable-extras --disable-tests --disable-samples --disable-dyload --host=arm-apple-darwin --build=arm-apple --with-cross-build="$CROSS_BUILD_DIR"/source CFLAGS="-arch arm64 -isysroot $(xcode-select -print-path)/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk -mios-version-min=13.4" CXXFLAGS="-arch arm64 -isysroot $(xcode-select -print-path)/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk -mios-version-min=13.4 -c -stdlib=libc++ --std=c++17" LDFLAGS="-stdlib=libc++ -lstdc++"
          make -j $(sysctl -n hw.physicalcpu)
          popd
          mkdir lib
          cp icu/$(ls icu)/icu4c/source/lib/libicuuc.a icu/$(ls icu)/icu4c/source/lib/libicudata.a lib

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: libicu_ios
          path: ./lib

  build_libicu_iossim_universal:
    needs: [build_libicu_iossim]
    runs-on: 'macos-15'
    steps:
      - name: Merge libicu binaries
        uses: actions/upload-artifact/merge@v4
        with:
          name: libicu-iossim-merged
          pattern: 'libicu-iossim-*'
          separate-directories: true

      - name: Download merged libicu binaries
        uses: actions/download-artifact@v4
        with:
          name: libicu-iossim-merged
          path: ./libicu-iossim-merged

      - name: Create universal libicu binaries
        run: |
          mkdir libicu_iossim_universal
          lipo -create libicu-iossim-merged/**/libicuuc.a -output libicu_iossim_universal/libicuuc.a
          lipo -create libicu-iossim-merged/**/libicudata.a -output libicu_iossim_universal/libicudata.a

      - name: Upload universal libicu binaries
        uses: actions/upload-artifact@v4
        with:
          name: libicu_iossim_universal
          path: ./libicu_iossim_universal/*
  build_libicu_tvossim:
    strategy:
      matrix:
        arch: [ 'arm64', 'x86_64' ]
    runs-on: 'macos-15' # arm64
    needs: build_libicu_osx
    steps:
      - uses: actions/checkout@v2

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: libicu-osx-arm64-build
          path: ./osx-arm64-build

      - name: Build ICU
        run: |
          # Thanks to https://github.com/apotocki/icu4c-iosx for the configure options
          curl -L -o icu.zip ${ICU_SOURCE_ZIP_URL}
          mkdir icu
          unzip -d icu icu.zip
          export ICU_DATA_FILTER_FILE="$PWD/src/cldr_data/filters.json"
          CROSS_BUILD_DIR="$(pwd)/osx-arm64-build"
          chmod +x $CROSS_BUILD_DIR/source/bin/* # the exec bit is lost during github actions uploading and downloading
          pushd icu/$(ls icu)/icu4c/source
          ./configure --enable-static --disable-shared --with-data-packaging=static --disable-tools --disable-extras --disable-tests --disable-samples --disable-dyload --host=arm-apple-darwin --build=${{ matrix.arch }}-apple --with-cross-build="$CROSS_BUILD_DIR"/source CFLAGS="-arch ${{ matrix.arch }} -isysroot $(xcode-select -print-path)/Platforms/AppleTVSimulator.platform/Developer/SDKs/AppleTVSimulator.sdk -mtvos-simulator-version-min=13.4" CXXFLAGS="-arch ${{ matrix.arch }} -isysroot $(xcode-select -print-path)/Platforms/AppleTVSimulator.platform/Developer/SDKs/AppleTVSimulator.sdk -mtvos-simulator-version-min=13.4 -c -stdlib=libc++ --std=c++17" LDFLAGS="-stdlib=libc++ -lstdc++"
          make -j $(sysctl -n hw.physicalcpu)
          popd
          mkdir lib
          cp icu/$(ls icu)/icu4c/source/lib/libicuuc.a icu/$(ls icu)/icu4c/source/lib/libicudata.a lib

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: libicu-tvossim-${{ matrix.arch }}
          path: ./lib

  build_libicu_tvos:
    runs-on: 'macos-15' # arm64
    needs: build_libicu_osx
    steps:
      - uses: actions/checkout@v2

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: libicu-osx-arm64-build
          path: ./osx-arm64-build

      - name: Build ICU
        run: |
          # Thanks to https://github.com/apotocki/icu4c-iosx for the configure options
          curl -L -o icu.zip ${ICU_SOURCE_ZIP_URL}
          mkdir icu
          unzip -d icu icu.zip
          export ICU_DATA_FILTER_FILE="$PWD/src/cldr_data/filters.json"
          CROSS_BUILD_DIR="$(pwd)/osx-arm64-build"
          chmod +x $CROSS_BUILD_DIR/source/bin/* # the exec bit is lost during github actions uploading and downloading
          pushd icu/$(ls icu)/icu4c/source
          ./configure --enable-static --disable-shared --with-data-packaging=static --disable-tools --disable-extras --disable-tests --disable-samples --disable-dyload --host=arm-apple-darwin --build=arm-apple --with-cross-build="$CROSS_BUILD_DIR"/source CFLAGS="-arch arm64 -isysroot $(xcode-select -print-path)/Platforms/AppleTVOS.platform/Developer/SDKs/AppleTVOS.sdk -mtvos-version-min=13.4" CXXFLAGS="-arch arm64 -isysroot $(xcode-select -print-path)/Platforms/AppleTVOS.platform/Developer/SDKs/AppleTVOS.sdk -mtvos-version-min=13.4 -c -stdlib=libc++ --std=c++17" LDFLAGS="-stdlib=libc++ -lstdc++"
          make -j $(sysctl -n hw.physicalcpu)
          popd
          mkdir lib
          cp icu/$(ls icu)/icu4c/source/lib/libicuuc.a icu/$(ls icu)/icu4c/source/lib/libicudata.a lib

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: libicu_tvos
          path: ./lib

  build_libicu_tvossim_universal:
    needs: [build_libicu_tvossim]
    runs-on: 'macos-15'
    steps:
      - name: Merge libicu binaries
        uses: actions/upload-artifact/merge@v4
        with:
          name: libicu-tvossim-merged
          pattern: 'libicu-tvossim-*'
          separate-directories: true

      - name: Download merged libicu binaries
        uses: actions/download-artifact@v4
        with:
          name: libicu-tvossim-merged
          path: ./libicu-tvossim-merged

      - name: Create universal libicu binaries
        run: |
          mkdir libicu_tvossim_universal
          lipo -create libicu-tvossim-merged/**/libicuuc.a -output libicu_tvossim_universal/libicuuc.a
          lipo -create libicu-tvossim-merged/**/libicudata.a -output libicu_tvossim_universal/libicudata.a

      - name: Upload universal libicu binaries
        uses: actions/upload-artifact@v4
        with:
          name: libicu_tvossim_universal
          path: ./libicu_tvossim_universal/*
