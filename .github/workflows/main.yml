name: Release (explicit authorization required)

on:
  push:
    branches:
      - main
      - release/**

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - release/**

  workflow_dispatch:
    inputs:
      operation:
        description: Contracts only by default; release operations sign and publish
        type: choice
        default: contracts
        options: [contracts, release-dev, release-prod]
      authorize_release:
        description: Owner explicitly approves signing and publication, not build-only validation
        type: boolean
        default: false
      expected_sha:
        description: Full reviewed commit SHA (required for a release)
        type: string
  
permissions:
  contents: read

jobs:
  provenance_contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: |
          python3 -m venv artifacts/validation-env
          artifacts/validation-env/bin/python -m pip install --no-cache-dir -r tests/requirements.txt
          artifacts/validation-env/bin/python -m unittest discover -s tests -v

  release_authorization:
    needs: provenance_contracts
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_release && inputs.operation != 'contracts' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 eng/build_only.py authorize
        env:
          AUTHORIZE_NATIVE: ${{ inputs.authorize_release }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          BUILD_SCOPE: ${{ inputs.operation }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}

  build_unoicu:
    needs: [provenance_contracts, release_authorization]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Build one set of archives per emscripten version consumed by a supported .NET runtime.
        # The Uno.Wasm.Bootstrap native-file selector picks the archive matching the consumer's
        # emscripten version (see nuget/uno.icu-wasm/buildTransitive/Uno.icu-wasm.targets).
        #   3.1.56 -> .NET 9 / .NET 10
        #   5.0.6  -> .NET 11 (preview 6+)
        EMSCRIPTEN_VERSION: [ '3.1.56', '5.0.6' ]
        multithreaded: [true, false]
        simd: [true, false]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Free disk space (Linux)
        uses: ./.github/actions/host-cleanup-linux

      - name: Build unoicu.a
        run: |
          python eng/provenance.py fetch-source --archive icu.zip
          cp icu.zip src/unoicu/icu.zip
          pushd src/unoicu
          FEATURE_DIR=$([ "${{ matrix.multithreaded }}" = 'true' ] && echo 'mt' || echo 'st')
          SIMD_SUFFIX=$([ "${{ matrix.simd }}" = 'true' ] && echo ',simd' || echo '')
          TEMP_SIMD_TAG=$([ "${{ matrix.simd }}" = 'true' ] && echo 'simd' || echo 'nosimd')
          TEMP_OUTPUT="out/${{ matrix.EMSCRIPTEN_VERSION }}/${FEATURE_DIR}-${TEMP_SIMD_TAG}"
          mkdir -p "${TEMP_OUTPUT}"

          docker build --build-arg EMSCRIPTEN_VERSION=${{ matrix.EMSCRIPTEN_VERSION }} --build-arg IS_MULTITHREADED=${{ matrix.multithreaded }} --build-arg IS_SIMD_SUPPORTED=${{ matrix.simd }} --output type=local,dest=${TEMP_OUTPUT} .

          FINAL_DIR="out/unoicu.a/${{ matrix.EMSCRIPTEN_VERSION }}/${FEATURE_DIR}${SIMD_SUFFIX}"
          mkdir -p "${FINAL_DIR}"
          mv "${TEMP_OUTPUT}/unoicu.a" "${FINAL_DIR}/unoicu.a"
          rm -rf "out/${{ matrix.EMSCRIPTEN_VERSION }}"
          popd

      - name: Upload unoicu.a
        uses: actions/upload-artifact@v4
        with:
          name: unoicu-${{ matrix.EMSCRIPTEN_VERSION }}-${{ matrix.multithreaded && 'mt' || 'st' }}-${{ matrix.simd && 'simd' || 'nosimd' }}
          path: ./src/unoicu/out/unoicu.a

  build_icudt:
    needs: [provenance_contracts, release_authorization]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Free disk space (Linux)
        uses: ./.github/actions/host-cleanup-linux

      - name: Build icudt.dat
        run: |
          python eng/provenance.py fetch-source --archive icu.zip
          cp icu.zip src/cldr_data/icu.zip
          pushd src/cldr_data
          docker build --output type=local,dest=. .
          popd

      - name: Upload icudt.dat
        uses: actions/upload-artifact@v4
        with:
          name: icudt.dat
          path: ./src/cldr_data/icudt.dat

  build_libicu_windows:
    needs: [provenance_contracts, release_authorization]
    runs-on: 'windows-2025'
    
    steps:
      - uses: microsoft/setup-msbuild@v2
    
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
    
      - name: Build ICU
        shell: pwsh
        run: |
          python eng/provenance.py fetch-source --archive icu.zip
          if ($LASTEXITCODE -ne 0) { throw "ICU source verification failed" }
          Expand-Archive icu.zip -DestinationPath icu
          $env:ICU_DATA_FILTER_FILE = "$PWD/src/cldr_data/filters.json"

          Push-Location icu/*/icu4c/source

          # Patch all vcxproj files to use static CRT (/MT) instead of dynamic (/MD), eliminating msvcp/vcruntime DLL dependencies
          Get-ChildItem -Recurse -Filter *.vcxproj | ForEach-Object { (Get-Content $_.FullName) -replace 'MultiThreadedDLL', 'MultiThreaded' | Set-Content $_.FullName }
          
          msbuild allinone\allinone.sln /p:Configuration=Release /p:Platform=x64 /p:SkipUWP=true /p:WindowsTargetPlatformVersion=10.0.26100.0 "/t:common;stubdata" /m
          if ($LASTEXITCODE -ne 0) { throw "ICU x64 build failed" }
          msbuild allinone\allinone.sln /p:Configuration=Release /p:Platform=ARM64 /p:SkipUWP=true /p:WindowsTargetPlatformVersion=10.0.26100.0 "/t:common;stubdata" /m
          if ($LASTEXITCODE -ne 0) { throw "ICU ARM64 build failed" }
    
          Pop-Location
          New-Item -ItemType Directory -Path libx64
          New-Item -ItemType Directory -Path libARM64
          $icuDir = (Get-ChildItem icu).Name
          Copy-Item "icu/$icuDir/icu4c/bin64/icuuc*.dll" libx64
          Copy-Item "icu/$icuDir/icu4c/bin64/icudt*.dll" libx64
          Copy-Item "icu/$icuDir/icu4c/binARM64/icuuc*.dll" libARM64
          Copy-Item "icu/$icuDir/icu4c/binARM64/icudt*.dll" libARM64

      - name: Upload binaries (x64)
        uses: actions/upload-artifact@v4
        with:
          name: libicu-windows-x64
          path: ./libx64

      - name: Upload binaries (ARM64)
        uses: actions/upload-artifact@v4
        with:
          name: libicu-windows-arm64
          path: ./libARM64

  build_libicu_osx:
    needs: [provenance_contracts, release_authorization]
    strategy:
      matrix:
        arch: [ 'x86_64','arm64' ]
    runs-on: ${{ matrix.arch == 'x86_64' && 'macos-15-intel' || 'macos-15' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build ICU
        run: |
          python eng/provenance.py fetch-source --archive icu.zip
          mkdir icu
          unzip -d icu icu.zip
          export ICU_DATA_FILTER_FILE="$PWD/src/cldr_data/filters.json"
          pushd icu/$(ls icu)/icu4c/source
          ./runConfigureICU macOS --with-data-packaging=archive
          make -j $(sysctl -n hw.physicalcpu)
          popd
          mkdir lib
          cp icu/$(ls icu)/icu4c/source/lib/libicuuc.dylib icu/$(ls icu)/icu4c/source/stubdata/libicudata.dylib lib
          if ${{ matrix.arch == 'arm64' && 'true' || 'false' }} ; then
            mkdir osx-arm64-build
            cp -r icu/$(ls icu)/icu4c/* osx-arm64-build
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: libicu-osx-${{ matrix.arch }}
          path: ./lib

      - name: Upload whole build output for cross-compilation
        uses: actions/upload-artifact@v4
        if: matrix.arch == 'arm64'
        with:
          name: libicu-osx-arm64-build
          path: ./osx-arm64-build

  build_libicu_osx_universal:
    needs: [build_libicu_osx]
    runs-on: 'macos-15'
    steps:
      - name: Merge libicu binaries
        uses: actions/upload-artifact/merge@v4
        with:
          name: libicu-osx-merged
          pattern: 'libicu-osx-*'
          separate-directories: true

      - name: Download merged libicu binaries
        uses: actions/download-artifact@v4
        with:
          name: libicu-osx-merged
          path: ./libicu-osx-merged

      - name: Create universal libicu binaries
        run: |
          mkdir libicu_osx_universal
          lipo -create libicu-osx-merged/**/libicuuc.dylib -output libicu_osx_universal/libicuuc.dylib
          lipo -create libicu-osx-merged/**/libicudata.dylib -output libicu_osx_universal/libicudata.dylib
          
      - name: Upload universal libicu binaries
        uses: actions/upload-artifact@v4
        with:
          name: libicu_osx_universal
          path: ./libicu_osx_universal/*

  package:
    needs: [build_unoicu, build_icudt, build_libicu_osx_universal, build_libicu_iossim_universal, build_libicu_ios, build_libicu_tvossim_universal, build_libicu_tvos, build_libicu_windows]
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Merge artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: merged-artifacts
          pattern: '{libicu_osx_universal,libicu_iossim_universal,libicu_ios,libicu_tvossim_universal,libicu_tvos,libicu-windows-*,unoicu-*,icudt.dat}'
          separate-directories: true

      - name: Download merged artifacts
        uses: actions/download-artifact@v4
        with:
          name: merged-artifacts
          path: ./merged-artifacts

      - name: List files
        run: |
          Get-ChildItem -Recurse .

      - name: Move binaries to correct locations
        shell: bash
        run: |
          mkdir nuget/uno.icu-macos/libicu
          mv merged-artifacts/libicu_osx_universal/{libicuuc,libicudata}.dylib ./nuget/uno.icu-macos/libicu
          mkdir nuget/uno.icu-ios/iossim
          mv merged-artifacts/libicu_iossim_universal/{libicuuc,libicudata}.a ./nuget/uno.icu-ios/iossim
          mkdir nuget/uno.icu-ios/ios
          mv merged-artifacts/libicu_ios/{libicuuc,libicudata}.a ./nuget/uno.icu-ios/ios

          mkdir nuget/uno.icu-tvos/tvossim
          mv merged-artifacts/libicu_tvossim_universal/{libicuuc,libicudata}.a ./nuget/uno.icu-tvos/tvossim
          mkdir nuget/uno.icu-tvos/tvos
          mv merged-artifacts/libicu_tvos/{libicuuc,libicudata}.a ./nuget/uno.icu-tvos/tvos

          mkdir -p nuget/uno.icu-win/libicu/x64
          mv merged-artifacts/libicu-windows-x64/* ./nuget/uno.icu-win/libicu/x64
          mkdir -p nuget/uno.icu-win/libicu/arm64
          mv merged-artifacts/libicu-windows-arm64/* ./nuget/uno.icu-win/libicu/arm64

          mv ./merged-artifacts/icudt.dat/icudt.dat ./nuget/

          mkdir -p ./nuget/uno.icu-wasm/buildTransitive/native/unoicu.a
          pushd merged-artifacts
          shopt -s nullglob
          for dir in unoicu-*; do
            SRC_BASE="$dir/unoicu.a"
            if [ ! -d "$SRC_BASE" ]; then
              SRC_BASE="$dir"
            fi

            find "$SRC_BASE" -mindepth 1 -maxdepth 1 -type d ! -name '*nosimd*' -print0 | while IFS= read -r -d '' version_dir; do
              cp -R "$version_dir" ../nuget/uno.icu-wasm/buildTransitive/native/unoicu.a/
            done
          done
          find ../nuget/uno.icu-wasm/buildTransitive/native/unoicu.a -type d -name '*nosimd*' -exec rm -rf {} +
          popd

      - name: List files
        run: |
          Get-ChildItem -Recurse .

      - uses: dotnet/nbgv@f088059084cb5d872e9d1a994433ca6440c2bf72 # v0.4.2
        id: nbgv
        with:
          toolVersion: 3.6.139
          setAllVars: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.100

      - name: Build nuget
        run: |
          ./eng/Pack.ps1 -Version '${{ steps.nbgv.outputs.SemVer2 }}' -SourceArchive icu.zip -OutputDirectory artifacts/packages
          New-Item -ItemType Directory artifacts/ReleaseEvidence | Out-Null
          Copy-Item artifacts/packages/unsigned-packages.json artifacts/ReleaseEvidence/unsigned-packages.json
          Copy-Item icu.zip artifacts/ReleaseEvidence/icu-source.zip

      - name: Verify NuGet notice packing contract with the pinned tool
        run: |
          python tests/notice_pack.py --archive icu.zip --nuget artifacts/tools/nuget-6.14.0.exe --work-directory artifacts/notice-contract
          if ($LASTEXITCODE -ne 0) { throw "NuGet notice contract failed" }

      - name: Exercise packaged Windows x64 ICU and filtered data
        shell: pwsh
        run: |
          $package = Get-Item "artifacts/packages/Uno.icu-win.${{ steps.nbgv.outputs.SemVer2 }}.nupkg"
          $hash = (Get-FileHash $package.FullName -Algorithm SHA256).Hash
          python tests/icu_smoke.py --package $package.FullName --work-directory artifacts/win-smoke --expected-sha256 $hash --output artifacts/ReleaseEvidence/windows-smoke.json
          if ($LASTEXITCODE -ne 0) { throw "Windows ICU/data smoke failed" }

      - name: Add NuGet Summary
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### NuGet Package Summary'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value 'Package version: `${{ steps.nbgv.outputs.SemVer2 }}`'

      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: ./artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: source-evidence
          path: artifacts/ReleaseEvidence
          if-no-files-found: error
          retention-days: 90

  macos_smoke:
    needs: package
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: packages
      - name: Exercise packaged macOS ICU and filtered data
        shell: bash
        run: |
          PACKAGE=(packages/Uno.icu-macos.*.nupkg)
          HASH=$(shasum -a 256 "${PACKAGE[0]}")
          python3 tests/icu_smoke.py --package "${PACKAGE[0]}" --work-directory artifacts/mac-smoke --expected-sha256 "${HASH%% *}" --output artifacts/macos-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-${{ matrix.runner }}
          path: artifacts/macos-smoke.json
          if-no-files-found: error
          retention-days: 90

  sign:
    name: Sign Package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_release && inputs.expected_sha == github.sha && ((inputs.operation == 'release-dev' && github.ref == 'refs/heads/main') || (inputs.operation == 'release-prod' && startsWith(github.ref, 'refs/heads/release/'))) }}
    runs-on: windows-latest
    environment: PackageSign

    permissions:
      id-token: write # Required for requesting the JWT
      contents: read
      attestations: write

    needs:
      - package
      - macos_smoke

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: artifacts\NuGet

      - uses: actions/download-artifact@v4
        with:
          name: source-evidence
          path: artifacts/ReleaseEvidence

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-smoke-*
          path: artifacts/ReleaseEvidence/macos-smoke

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      # Install the code signing tool    
      - name: Install Sign CLI tool
        run: dotnet tool install --tool-path . sign --version 0.9.1-beta.25278.1
      
      # Login to Azure using a ServicePrincipal configured to authenticate agaist a GitHub Action
      - name: 'Az CLI login'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          allow-no-subscriptions: true
          client-id: ${{ secrets.SIGN_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SIGN_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SIGN_AZURE_SUBSCRIPTION_ID }}

      - name: List files
        run: |
          Get-ChildItem -Recurse .

      # Run the signing command
      - name: Sign artifacts
        shell: pwsh
        run: >
          ./sign code azure-key-vault
          artifacts\NuGet\*.nupkg
          --publisher-name "Uno Platform"
          --description "uno.icu"
          --description-url "https://github.com/${{ env.GITHUB_REPOSITORY }}"
          --azure-key-vault-managed-identity true
          --azure-key-vault-url "${{ secrets.SIGN_KEY_VAULT_URL }}"
          --azure-key-vault-certificate "${{ secrets.SIGN_KEY_VAULT_CERTIFICATE_ID }}"
          --verbosity information

      - name: Verify signed packages and preserve unsigned payload identity
        # Signing changes the archive. Inventory and attest only after signature validation.
        run: |
          foreach ($package in Get-ChildItem artifacts/NuGet/*.nupkg) {
            dotnet nuget verify $package.FullName --all
            if ($LASTEXITCODE -ne 0) { throw "NuGet signature verification failed" }
          }
          $unsigned = Get-Content artifacts/ReleaseEvidence/unsigned-packages.json -Raw | ConvertFrom-Json
          python eng/provenance.py inventory --directory artifacts/NuGet --version $unsigned.packageVersion --commit $env:GITHUB_SHA --phase signed --baseline artifacts/ReleaseEvidence/unsigned-packages.json --output artifacts/ReleaseEvidence/signed-packages.json
          if ($LASTEXITCODE -ne 0) { throw "Signed package validation failed" }

      - name: Attest final signed package bytes
        id: attest_packages
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/NuGet/*.nupkg

      - name: Retain attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          Copy-Item '${{ steps.attest_packages.outputs.bundle-path }}' artifacts/ReleaseEvidence/signed-packages.sigstore.jsonl
          foreach ($package in Get-ChildItem artifacts/NuGet/*.nupkg) {
            $result = gh attestation verify $package.FullName --bundle artifacts/ReleaseEvidence/signed-packages.sigstore.jsonl --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/main.yml" --source-digest $env:GITHUB_SHA --signer-digest $env:GITHUB_SHA --format json
            if ($LASTEXITCODE -ne 0) { throw "Final package attestation verification failed" }
            $result | Set-Content "artifacts/ReleaseEvidence/$($package.Name).verification.json"
          }

      - name: Upload Signed Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuGet-Signed
          path: .\artifacts\NuGet
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: artifacts/ReleaseEvidence
          if-no-files-found: error
          retention-days: 90

  publish_dev:
    name: Publish Dev
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_release && inputs.expected_sha == github.sha && inputs.operation == 'release-dev' && github.ref == 'refs/heads/main' }}
    runs-on: windows-latest

    needs:
      - sign

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: NuGet-Signed
          path: artifacts

      - name: NuGet Push
        shell: pwsh
        run: |
          dotnet nuget push artifacts\*.nupkg -s https://api.nuget.org/v3/index.json -k "${{ secrets.NUGET_ORG_API_KEY }}"

  publish_prod:
    name: Publish Production
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_release && inputs.expected_sha == github.sha && inputs.operation == 'release-prod' && startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: windows-latest
    environment: Production
    needs:
      - sign
  
    permissions:
      contents: write  # allow pushing tags
  
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
  
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: NuGet-Signed
          path: artifacts

      - name: NuGet Push
        shell: pwsh
        run: |
          dotnet nuget push artifacts\*.nupkg -s https://api.nuget.org/v3/index.json -k "${{ secrets.NUGET_ORG_API_KEY }}"

      - name: Tag Release
        uses: ./.github/workflows/actions/tag-release

      # The existing tag composite performs a checkout, which cleans untracked
      # artifacts. Download exact signed packages again; never reconstruct them.
      - uses: actions/download-artifact@v4
        with:
          name: NuGet-Signed
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-evidence

      - name: Retain release evidence beyond Actions expiry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $inventory = Get-Content release-evidence/signed-packages.json -Raw | ConvertFrom-Json
          # No --clobber, no old identity repair. Existing releases fail closed.
          Compress-Archive -Path release-evidence/* -DestinationPath release-evidence.zip
          $files = @(Get-ChildItem artifacts/*.nupkg | ForEach-Object FullName) + @("$PWD/release-evidence.zip")
          $options = @()
          if ($inventory.packageVersion.Contains('-')) { $options += '--prerelease' }
          gh release create $inventory.packageVersion @files --verify-tag --title $inventory.packageVersion --notes "Source-pinned ICU 77.1; complete notices and final signed-package provenance are attached." @options
          if ($LASTEXITCODE -ne 0) { throw "Durable release evidence publication failed" }

  build_libicu_iossim:
    strategy:
      matrix:
        arch: [ 'arm64', 'x86_64' ]
    runs-on: 'macos-15' # arm64
    needs: build_libicu_osx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: libicu-osx-arm64-build
          path: ./osx-arm64-build

      - name: Build ICU
        run: |
          # Thanks to https://github.com/apotocki/icu4c-iosx for the configure options
