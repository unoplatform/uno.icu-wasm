name: "Tag and push to GitHub"
description: "Tag and push to GitHub"

runs:
  using: "composite"
  steps:
  - name: Checkout
    uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    with:
      # Only this explicit production-release composite pushes a tag.
      persist-credentials: true

  - name: Setup .NET SDK
    uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
    with:
      dotnet-version: '10.0.x'

  - uses: dotnet/nbgv@f088059084cb5d872e9d1a994433ca6440c2bf72 # v0.4.2
    name: NBGV
    id: nbgv
    with:
      toolVersion: 3.6.139
      setAllVars: true

  - name: "Tag and push to GitHub"
    shell: pwsh
    run: |
      git config user.email "info@platform.uno"
      git config user.name "Uno DevOps"
      git tag $env:NBGV_SemVer2
      git push origin $env:NBGV_SemVer2
